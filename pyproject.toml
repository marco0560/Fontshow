[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "fontshow"
dynamic = ["version"]
description = "Fontshow utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marco Coppola" }]
dependencies = [
    "jsonschema>=4.23.0",
    "language-tags>=1.2.0",
    "pycountry>=22.3.5",
]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:\\.post\\d+)?)$"
git_describe_command = "git describe --dirty --tags --long --match v*"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["fontshow*"]
exclude = ["node_modules*", "docs*", "scripts*"]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "packaging"
]

docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.7",
  "mkdocstrings[python]>=0.24"
]

[project.scripts]
fontshow = "fontshow.__main__:main"

# -------------------------------------------------
# Formatting
# -------------------------------------------------

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

# -------------------------------------------------
# Ruff linting policy (Phase C + Phase 1)
# -------------------------------------------------

[tool.ruff.lint]
# Baseline: real bugs + imports
# Phase 1: exception semantics

select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order / correctness
    "UP",   # pyupgrade

    # Phase 1 — Exception semantics
    "BLE",
    "TRY",
    "EM",
    "S110",
    "S112",

    # Phase 2 — Import/type boundary (TEMPORARY for editor)
    "TC",
]

ignore = [
    # Documentation / style
    "D",

    # Typing strictness
    "ANN",
    "FBT",

    # Security (later phase)
    "S603",
    "S324",

    # Complexity (mapping later)
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",

    # Magic values / design
    "PLR2004",

    # pathlib migration
    "PTH",

    # Formatting (handled elsewhere)
    "COM812",
    "E501",

    # Hygiene / TODO
    "TD",
    "ERA001",
    "FIX002",

    # Micro-refactors / perf
    "SIM",
    "FURB",
    "PERF",
    "ARG",
]

[tool.ruff.lint.isort]
known-first-party = ["fontshow"]
combine-as-imports = true

# -------------------------------------------------
# Ruff formatter
# -------------------------------------------------

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
