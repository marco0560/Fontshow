[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "fontshow"
dynamic = ["version"]
description = "Fontshow utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marco Coppola" }]
dependencies = [
    "jsonschema>=4.23.0",
    "language-tags>=1.2.0",
    "pycountry>=22.3.5",
]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:\\.post\\d+)?)$"
git_describe_command = "git describe --dirty --tags --long --match v*"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["fontshow*"]
exclude = ["node_modules*", "docs*", "scripts*"]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "packaging"
]

docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.7",
  "mkdocstrings[python]>=0.24"
]

[project.scripts]
fontshow = "fontshow.__main__:main"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
