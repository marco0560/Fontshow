[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fontshow"
dynamic = ["version"]
description = "Fontshow utilities"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }

authors = [{ name = "Marco Coppola" }]

dependencies = [
    "jsonschema>=4.23.0,<5",
    "language-tags>=1.2.0,<2",
    "pycountry>=22.3.5,<27",
    "fonttools>=4.61.0,<5",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=1,<2",
    "mkdocs-awesome-pages-plugin>=2.10,<3",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "packaging",
    "build",
    "setuptools-scm>=8",
    "codira[bundle-official]==1.40.0",
    "libcst>=1.8.6",
    "pyupgrade>=3.21.2",
    "types-jsonschema>=4.26.0.20260408",
]

[project.scripts]
fontshow = "fontshow.__main__:main"

[tool.uv]
python-preference = "only-managed"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["fontshow*"]
exclude = ["docs*", "node_modules*", "scripts*"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:\\.post\\d+)?)$"
git_describe_command = "git describe --dirty --tags --long --match v*"
version_scheme = "post-release"
local_scheme = "no-local-version"

# ============================================================
# Ruff
# ============================================================

[tool.ruff]
line-length = 88
target-version = "py313"

extend-exclude = [
    ".git",
    ".mypy_cache",
    ".mypy_cache_run",
    ".mypy_cache_verify",
    ".pre-commit-cache",
    ".pytest_cache",
    ".pytest_cache_local",
    ".pytest_tmp",
    ".pytest_diag*",
    ".pt_*",
    ".ruff_cache",
    ".ruff_cache_run",
    ".tmp-pytest",
    ".tmp_pytest_run",
    ".venv",
    "build",
    "dist",
    "node_modules",
    "pytest-cache-files-*",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",

    "BLE",
    "TRY",
    "EM",
    "S110",
    "S112",

    "TC",

    "PTH",

    "B",

    "RET",
    "LOG",

    "PLR",
    "RSE",
    "SIM",
    "ICN",
    "TCH",
    "PIE",

    "S602",
    "S607",
    "S610",
    "S701",

    "C901",
    "PLR0912",

    "ERA",
    "TD",
]

ignore = [
    "D",

    "ANN",
    "FBT",

    "S603",
    "S324",

    "PLR0911",
    "PLR0915",

    "PLR2004",

    "COM812",
    "E501",

    "FIX002",

    "FURB",
    "PERF",

    "B008",
    "B905",
]

fixable = ["I", "UP", "B007", "B009"]

unfixable = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "S607", "ARG", "PLR"]

"tests/test_charset_decoding.py" = ["B017"]

"tests/helpers.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 18

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["fontshow"]
combine-as-imports = true

# ============================================================
# mypy
# ============================================================

[tool.mypy]
python_version = "3.13"

strict = true

warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true

show_error_codes = true

exclude = """(?x)(
    ^build/
  | ^dist/
  | ^src/fontshow\\.egg-info/
  | ^\\.mypy_cache(?:/|$)
  | ^\\.mypy_cache_run(?:/|$)
  | ^\\.mypy_cache_verify(?:/|$)
  | ^\\.pre-commit-cache(?:/|$)
  | ^\\.pytest_cache(?:/|$)
  | ^\\.pytest_cache_local(?:/|$)
  | ^\\.pytest_tmp(?:/|$)
  | ^\\.pytest_diag[^/]*(?:/|$)
  | ^\\.pt_[^/]+(?:/|$)
  | ^\\.ruff_cache(?:/|$)
  | ^\\.tmp-pytest(?:/|$)
  | ^\\.tmp_pytest_run(?:/|$)
  | ^pytest-cache-files-[^/]+(?:/|$)
)"""

[[tool.mypy.overrides]]
module = ["fontTools.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

# ============================================================
# pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]

norecursedirs = [
    ".git",
    ".mypy_cache",
    ".pre-commit-cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "node_modules",
]
