[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "fontshow"
dynamic = ["version"]
description = "Fontshow utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marco Coppola" }]
dependencies = [
    "jsonschema>=4.23.0",
    "language-tags>=1.2.0",
    "pycountry>=22.3.5",
]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:\\.post\\d+)?)$"
git_describe_command = "git describe --dirty --tags --long --match v*"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["fontshow*"]
exclude = ["node_modules*", "docs*", "scripts*"]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "packaging"
]

docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.7",
  "mkdocstrings[python]>=0.24"
]

[project.scripts]
fontshow = "fontshow.__main__:main"

# -------------------------------------------------
# Formatting
# -------------------------------------------------

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

# -------------------------------------------------
# Ruff linting policy (Phase C + Phase 1)
# -------------------------------------------------

[tool.ruff.lint]
# Baseline: real bugs + imports
# Phase 1 — Exception semantics
# Phase 2 — Import/type boundary
# Phase 3 — pathlib migration
# Phase 4 — Bug-risk & correctness
# Phase 5 — Return & logging correctness
# ------------------------------------------------------------
# Phase 6 — Robustness hardening (low-noise / high-value)
#
# Adds:
#   PLR  → risky constructs (not complexity limits)
#   RSE  → raise misuse (exception correctness)
#   SIM  → logic simplification traps (can reveal hidden bugs)
#   ICN  → import alias / shadowing correctness
#   TCH  → typing boundary correctness helpers
#
# Goal:
#   Catch remaining real defects without enabling high-noise families
#   (docstrings, typing completeness, complexity, perf, style).
# ------------------------------------------------------------

select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order / correctness
    "UP",   # pyupgrade

    # ------------------------------------------------------------
    # Phase 1 — Exception semantics
    # ------------------------------------------------------------
    "BLE",
    "TRY",
    "EM",
    "S110",
    "S112",

    # ------------------------------------------------------------
    # Phase 2 — Import/type boundary
    # ------------------------------------------------------------
    "TC",

    # ------------------------------------------------------------
    # Phase 3 — pathlib migration
    # ------------------------------------------------------------
    "PTH",

    # ------------------------------------------------------------
    # Phase 4 — Bug-risk & correctness
    # ------------------------------------------------------------
    "B",      # flake8-bugbear (high-value correctness rules)

    # ------------------------------------------------------------
    # Phase 5 — Return & logging correctness
    # ------------------------------------------------------------
    "RET",    # return correctness
    "LOG",    # logging misuse

    # ------------------------------------------------------------
    # Phase 6 — Robustness hardening (NEW)
    # ------------------------------------------------------------
    "PLR",    # pylint refactor (risky constructs only; complexity still ignored)
    "RSE",    # raise misuse / exception correctness
    "SIM",    # simplification rules revealing hidden logic issues
    "ICN",    # import alias / shadowing correctness
    "TCH",    # typing boundary correctness helpers
]

ignore = [
    # ------------------------------------------------------------
    # Documentation / style
    # ------------------------------------------------------------
    "D",

    # ------------------------------------------------------------
    # Typing strictness (future phase)
    # ------------------------------------------------------------
    "ANN",
    "FBT",

    # ------------------------------------------------------------
    # Security — partially enforced
    # (S101 and S108 disabled in tests via per-file-ignores)
    # ------------------------------------------------------------
    "S603",
    "S324",

    # ------------------------------------------------------------
    # Complexity — postponed
    # ------------------------------------------------------------
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",

    # ------------------------------------------------------------
    # Magic values / design
    # ------------------------------------------------------------
    "PLR2004",

    # ------------------------------------------------------------
    # Formatting (handled elsewhere)
    # ------------------------------------------------------------
    "COM812",
    "E501",

    # ------------------------------------------------------------
    # Hygiene / TODO
    # ------------------------------------------------------------
    "TD",
    "ERA001",
    "FIX002",

    # ------------------------------------------------------------
    # Performance / micro-refactors — still optional
    # ------------------------------------------------------------
    "FURB",
    "PERF",
    "ARG",

    # ------------------------------------------------------------
    # Bugbear rules intentionally ignored
    # ------------------------------------------------------------
    "B008",   # function calls in default args (used intentionally sometimes)
    "B905",   # zip() strict — too noisy for now
]

fixable = [
    "I",      # import sorting
    "UP",     # pyupgrade
    "B007",   # unused loop variable → _var
    "B009",   # getattr(const) → attribute
]

unfixable = [
    "E501",   # never auto-wrap long lines (TeX/regex risk)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"] # Allow asserts in tests
"tests/test_charset_decoding.py" = [
    "B017",   # So only truly generic-failure tests allow broad Exception
]
"tests/helpers.py" = [
    "PLR0913",   # test helper requires multiple independent knobs
]

[tool.ruff.lint.isort]
known-first-party = ["fontshow"]
combine-as-imports = true

# -------------------------------------------------
# Ruff formatter
# -------------------------------------------------

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
