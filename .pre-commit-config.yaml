repos:
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: mkdocs.yml
      - id: check-added-large-files

  # ------------------------------------------------------------------
  # Fontshow – generated documentation integrity
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      # Step 1: (re)generate cheatsheet.md deterministically
      - id: generate-cheatsheet
        name: Generate cheatsheet.md
        entry: python scripts/generate_cheatsheet.py
        language: system
        pass_filenames: false
        always_run: true

      # Step 2: ensure generated file is committed
      - id: verify-cheatsheet-clean
        name: Verify cheatsheet.md is up to date
        entry: >
          bash -c 'git diff --exit-code docs/cheatsheet.md ||
          (echo "ERROR: docs/cheatsheet.md is out of date.
          Run scripts/generate_cheatsheet.py and commit the result." && exit 1)'
        language: system
        pass_filenames: false
        always_run: true

      # Insert JSON in doc
      - id: update-schema-doc
        name: Update schema documentation
        entry: python scripts/update_schema_docs.py
        language: system
        pass_filenames: false
      # ------------------------------------------------------------------
      # Static typing (Fontshow)
      # ------------------------------------------------------------------
      - id: mypy
        name: mypy (fontshow)
        entry: python -m mypy src/fontshow
        language: python
        additional_dependencies: [mypy==1.19.1]
        pass_filenames: false
