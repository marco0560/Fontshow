name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NOTE:
# Pages deploys are serialized and previous runs are cancelled to ensure
# only the latest documentation is published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    uses: ./.github/workflows/docs-pages.yml
