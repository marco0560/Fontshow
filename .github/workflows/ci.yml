name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -------------------------
  # Job 1: Test (pytest)
  # -------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pre-commit

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

      - name: Run tests with coverage
        run: |
          pytest --cov=fontshow --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run test suite
        run: |
          pytest -q

  # -------------------------
  # Job 2: Docs (MkDocs + Pages)
  # -------------------------
  docs:
    needs: test
    uses: ./.github/workflows/docs-pages.yml
    with:
      fetch_depth: 0
