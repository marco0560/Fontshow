site_name: Fontshow
site_description: Analisi, normalizzazione e catalogazione dei font di sistema
site_author: Marco Coppola

repo_name: fontshow
repo_url: https://github.com/marco0560/Fontshow
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - footnotes

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md

  - Overview:
      - Architecture: architecture.md
      - Pipeline: pipeline.md
      - Roadmap: roadmap.md

  - Usage:
      - CLI Overview: cli.md
      - Cheatsheet: cheatsheet.md
      - Tools:
          - dump_fonts: tools/dump_fonts.md
          - parse_font_inventory: tools/parse_font_inventory.md
          - create_catalog: tools/create_catalog.md

  - Data Model:
      - Data Dictionary: data_dictionary.md
      - Schema:
          - Overview: schema/index.md
          - Inventory v1.1: schema/inventory-1.1.schema.json

  - Validation & Testing:
      - Testing Strategy: testing.md
      - Environment Matrix: environment-matrix.md

  - Development:
      - Dev Environment: dev-environment.md
      - Scripts: scripts.md
      - Contributing: CONTRIBUTING.md

  - Decisions:
      - Design Decisions: decisions.md
      - Security & Release Policy: security-and-release-policy.md
      - Key Rotation: key-rotation.md

  - Changelog: changelog.md
