site_name: Fontshow
site_description: Analisi, normalizzazione e catalogazione dei font di sistema
site_author: Marco Coppola

repo_name: fontshow
repo_url: https://github.com/marco0560/Fontshow
edit_uri: edit/main/docs/
exclude_docs: |
  _archive/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - js/mermaid-init.js

plugins:
  - search
  - awesome-pages
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md

  - Getting started:
    - Getting started: getting_started.md
    - Changelog summary: changelog-summary.md
    - Overview: pipeline.md
    - CLI: cli.md
