site_name: Fontshow
site_description: Analisi, normalizzazione e catalogazione dei font di sistema
site_author: Marco Coppola

repo_name: fontshow
repo_url: https://github.com/marco0560/Fontshow
edit_uri: edit/main/docs/
exclude_docs: |
  _archive/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - js/mermaid-init.js

plugins:
  - search
  - awesome-pages
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md

  - Getting started:
    - Getting started: getting_started.md
    - Changelog summary: changelog-summary.md
    - Overview: pipeline.md
    - CLI: cli.md
    - Cheatsheet: cheatsheet.md
    - Testing strategy: testing.md

  - Commands:
    - Preflight: tools/preflight.md
    - Dump fonts: tools/dump-fonts.md
    - Parse inventory: tools/parse-inventory.md
    - Validate inventory: tools/validate-inventory.md
    - Create catalog: tools/create-catalog.md

  - Data model:
    - Data dictionary: data_dictionary.md
    - Schema overview: schema/index.md
    - Inventory schema v1.3: schema/inventory_v1_3.md
    - Language normalization: schema/language-normalization.md

  - Development:
    - Architecture: architecture.md
    - Codebase map: codebase-map.md
    - Dev environment: dev-environment.md
    - Environment matrix: environment-matrix.md
    - Logging system: logging.md
    - Scripts: scripts.md
    - Contributing: CONTRIBUTING.md

  - Engineering:
    - Lessons Learned: engineering/lessons-learned.md
    - Codex evaluation: engineering/codex-evaluation-04-02-2026.md
    - Exceptions policy: engineering/exception_policy.md
    - Release system: engineering/release-system.md
    - TRACE logging guide: engineering/TRACE-logging-developper-guide.md

  - Documentation:
    - CLI:
      - CLI Contract: cli-contract.md

    - Planning & Governance:
      - Overview: planning/00_Planning_Document_Set.md
      - Timeline: planning/01_TIMELINE.md
      - Phases: planning/02_PHASES.md
      - Milestones: planning/03_MILESTONES_DEFINITION.md
      - Issue Model: planning/04_ISSUE_MODEL.md
      - Atomic Actions: planning/05_ATOMIC_ACTION_LIST.md
      - Issue Backlog: planning/06_ISSUE_BACKLOG_SYNTHESIS.md
      - Testing Strategy: planning/07_TESTING_STRATEGY.md
      - Stabilization Scope: planning/08_STABILIZATION_SCOPE.md
      - Hardening and loadability: planning/09_HARDENING_AND_LOADABILITY_BASELINE.md
      - Pipeline Robustness: planning/10_PIPELINE_ROBUSTNESS.md
      - Governance Notes: planning/11_GOVERNANCE_NOTES.md
      - V2 Design Spike: planning/12_V2_DESIGN_SPIKE.md

    - Decisions:
        decisions/index.md

  - Project:
    - Roadmap: roadmap.md
    - Security & release policy: security-and-release-policy.md
    - Release Checklist: release/checklist.md
    - Key rotation: key-rotation.md
