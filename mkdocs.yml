site_name: Fontshow
site_description: Analisi, normalizzazione e catalogazione dei font di sistema
site_author: Marco Coppola

repo_name: fontshow
repo_url: https://github.com/marco0560/Fontshow
edit_uri: edit/main/docs/
exclude_docs: |
  _archive/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - footnotes

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md

  - Getting started:
    - Getting started: getting_started.md
    - Changelog summary: changelog-summary.md
    - Overview: pipeline.md
    - CLI: cli.md
    - Cheatsheet: cheatsheet.md
    - Testing strategy: testing.md

  - Commands:
    - Preflight: tools/preflight.md
    - Dump fonts: tools/dump_fonts.md
    - Parse inventory: tools/parse_font_inventory.md
    - Create catalog: tools/create_catalog.md

  - Data model:
    - Data dictionary: data_dictionary.md
    - Schema overview: schema/index.md
    - Schema rationale: schema/font-inventory-schema.md
    - Inventory schema v1.1 (JSON): schema/inventory-1.1.schema.json

  - Development:
    - Architecture: architecture.md
    - Dev environment: dev-environment.md
    - Environment matrix: environment-matrix.md
    - Scripts: scripts.md
    - Contributing: CONTRIBUTING.md

  - Documentation:
    - Planning & Governance:
      - Overview: planning/00_Planning_Document_Set.md
      - Timeline: planning/01_TIMELINE.md
      - Phases: planning/02_PHASES.md
      - Milestones: planning/03_MILESTONES_DEFINITION.md
      - Issue Model: planning/04_ISSUE_MODEL.md
      - Atomic Actions: planning/05_ATOMIC_ACTION_LIST.md
      - Issue Backlog: planning/06_ISSUE_BACKLOG_SYNTHESIS.md
      - Testing Strategy: planning/07_TESTING_STRATEGY.md
      - Stabilization Scope: planning/08_STABILIZATION_SCOPE.md
      - CLI Contract: planning/09_CLI_CONTRACT.md
      - Pipeline Robustness: planning/10_PIPELINE_ROBUSTNESS.md
      - Governance Notes: planning/11_GOVERNANCE_NOTES.md
      - V2 Design Spike: planning/12_V2_DESIGN_SPIKE.md

    - Decisions:
      - Overview: decisions/index.md
      - "0001 – Base-zero replanning": decisions/0001-base-zero-replanning.md
      - "0002 – Planning system formalization": decisions/0002-planning-system-formalization.md
      - Legacy material: decisions/legacy_decisions.md

  - Project:
    - Roadmap: roadmap.md
    - Security & release policy: security-and-release-policy.md
    - Key rotation: key-rotation.md
